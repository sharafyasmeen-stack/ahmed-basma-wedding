<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ahmed &amp; Basma Wedding Invitation</title>
<meta property="og:type" content="website">
<meta property="og:site_name" content="Ahmed &amp; Basma Wedding Invitation">
<meta property="og:title" content="Ahmed &amp; Basma Wedding Invitation">
<meta property="og:description" content="Sunday 29 November 2026 · 6:00 PM · Azha Venue, El Shorouk">
<meta property="og:url" content="https://sharafyasmeen-stack.github.io/ahmed-basma-wedding/">
<meta property="og:image" content="https://sharafyasmeen-stack.github.io/ahmed-basma-wedding/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Ahmed &amp; Basma Wedding Invitation">
<meta name="twitter:image" content="https://sharafyasmeen-stack.github.io/ahmed-basma-wedding/og.jpg">
<link rel="icon" href="img/flower_tl.webp" type="image/webp">
<meta name="description" content="Sunday 29 November 2026 · 6:00 PM · Azha Venue, El Shorouk">
<meta name="theme-color" content="#46080b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@200;300;400&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#F5DDBF;
  --wine:#46080b;
  --wine-seal:#5a0c12;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --s:.44;
  --p:0;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#2b0407}
body{color:var(--cream);font-family:var(--sans);font-weight:300;-webkit-font-smoothing:antialiased}
img{display:block;user-select:none;-webkit-user-drag:none}

/* ---------- cover: your envelope, opened by scrolling ---------- */
.cover{position:fixed;top:0;left:50%;transform:translateX(-50%);width:min(100vw,480px);height:100vh;height:100lvh;z-index:30;overflow:hidden;pointer-events:none;
  background:#F8E1CF;opacity:var(--co,1)}
.cover img{position:absolute;left:50%;top:50%;width:108%;max-width:none;height:auto;opacity:0;--z:1;transform-origin:50% 56%;
  transform:translate(-50%,-50%) scale(var(--z));
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 7%,#000 93%,transparent 100%);mask-image:linear-gradient(180deg,transparent 0,#000 7%,#000 93%,transparent 100%);
  transition:opacity 1.2s ease;will-change:transform}
.cover.ready img{opacity:1}
.cover.gone{visibility:hidden}
.cue{position:absolute;left:50%;bottom:5.5svh;width:1px;height:46px;margin-left:-.5px;background:rgba(90,12,18,.28);overflow:hidden;transition:opacity .4s}
.cue::after{content:"";position:absolute;left:0;top:-50%;width:1px;height:50%;background:#5a0c12;animation:cue 2.2s ease-in-out infinite}
@keyframes cue{0%{top:-50%}100%{top:100%}}

/* ---------- one continuous background, flowers on both sides ---------- */
.bgfix{position:fixed;top:0;left:50%;transform:translateX(-50%);width:min(100vw,480px);height:100vh;height:100lvh;z-index:0;
  background:#470a0d url(img/bgtex.webp) center/cover no-repeat}
.stage{position:fixed;top:0;left:50%;transform:translateX(-50%);width:min(100vw,480px);height:100vh;height:100lvh;overflow:hidden;z-index:3;pointer-events:none}
.canvas{position:absolute;left:50%;top:50%;width:1080px;height:1920px;transform:translate(-50%,-50%) scale(var(--s))}
.g{position:absolute;will-change:transform}
.g img{width:100%;height:100%}
.e{width:100%;height:100%;opacity:0;transform:translate(var(--ex),var(--ey)) scale(.94);
   transition:opacity 2s ease var(--ed),transform 2.4s cubic-bezier(.2,.7,.2,1) var(--ed)}
body.ready .e{opacity:1;transform:none}
.e img{transform-origin:var(--o);animation:sway var(--d) ease-in-out infinite alternate;animation-delay:var(--sd,0s);will-change:transform}
@keyframes sway{from{transform:rotate(-.55deg)}to{transform:rotate(.65deg)}}
.g.tl{left:0;top:65px;width:397px;height:756px;transform:translate(calc(var(--p)*-50px),calc(var(--p)*-40px))}
.g.tr{left:413px;top:0;width:667px;height:747px;transform:translate(calc(var(--p)*50px),calc(var(--p)*-40px))}
.g.bl{left:0;top:772px;width:510px;height:1148px;transform:translate(calc(var(--p)*-50px),calc(var(--p)*40px))}
.g.br{left:580px;top:841px;width:500px;height:1079px;transform:translate(calc(var(--p)*50px),calc(var(--p)*40px))}
.tl .e{--ex:-70px;--ey:-40px;--ed:.1s;--o:0% 0%;--d:8s}
.tr .e{--ex:70px;--ey:-40px;--ed:.3s;--o:100% 0%;--d:9.5s;--sd:-3s}
.bl .e{--ex:-70px;--ey:40px;--ed:.5s;--o:0% 100%;--d:10s;--sd:-5s}
.br .e{--ex:70px;--ey:40px;--ed:.7s;--o:100% 100%;--d:8.5s;--sd:-1.5s}

/* ---------- pages: text lives only in the clear middle, never on the flowers ---------- */
.scroller{position:fixed;top:0;left:0;width:100%;height:100vh;height:100lvh;z-index:5;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:none;outline:none;
  -webkit-mask-image:linear-gradient(180deg,transparent 0,transparent 14%,#000 21%,#000 74%,transparent 80%,transparent 100%);
          mask-image:linear-gradient(180deg,transparent 0,transparent 14%,#000 21%,#000 74%,transparent 80%,transparent 100%)}
.scroller::-webkit-scrollbar{display:none}
.wrap{width:min(100%,480px);margin:0 auto}
.intro{height:90vh;height:90lvh}
.sec{min-height:100vh;min-height:100lvh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding-bottom:2lvh}
.in-w{width:calc(var(--s)*510px);display:flex;flex-direction:column;align-items:center}
.rv{opacity:0;transform:translateY(14px);transition:opacity 1.1s ease var(--dl,0s),transform 1.1s cubic-bezier(.2,.7,.2,1) var(--dl,0s)}
.rv.in{opacity:1;transform:none}

.names{width:calc(var(--s)*440px);height:auto;margin-bottom:calc(var(--s)*30px)}
.h2{font-weight:300;font-size:calc(var(--s)*60px);line-height:1.15;letter-spacing:.01em}
.orn1{width:calc(var(--s)*230px);height:auto;margin:calc(var(--s)*14px) 0 calc(var(--s)*16px)}
.orn2{width:calc(var(--s)*260px);height:auto;margin:calc(var(--s)*20px) 0 calc(var(--s)*14px)}
.dow{font-size:calc(var(--s)*34px);letter-spacing:.14em;font-weight:400;opacity:.9;line-height:1.1}
.day{font-size:calc(var(--s)*140px);line-height:1;font-weight:200;margin:calc(var(--s)*2px) 0;letter-spacing:-.01em}
.mon{font-size:calc(var(--s)*60px);font-weight:300;letter-spacing:.02em;line-height:1.1}
.yr{font-size:calc(var(--s)*40px);font-weight:300;letter-spacing:.1em;margin-top:calc(var(--s)*4px);opacity:.9;line-height:1.1}
.time{font-size:calc(var(--s)*76px);font-weight:300;letter-spacing:.02em;line-height:1.1}
.counting{font-size:calc(var(--s)*32px);letter-spacing:.06em;opacity:.85;margin:calc(var(--s)*26px) 0 calc(var(--s)*16px);font-weight:300}
.cd{display:flex;gap:calc(var(--s)*12px);width:100%;justify-content:center}
.cd div{flex:1;min-width:0;border:1px solid rgba(245,221,191,.45);border-radius:calc(var(--s)*22px);background:rgba(245,221,191,.045);padding:calc(var(--s)*22px) 0 calc(var(--s)*16px)}
.cd b{display:block;font-weight:300;font-size:calc(var(--s)*56px);line-height:1.1;font-variant-numeric:tabular-nums}
.cd span{display:block;margin-top:calc(var(--s)*6px);font-size:max(8px,calc(var(--s)*19px));letter-spacing:.08em;text-transform:uppercase;opacity:.75;font-weight:400}
.cd b.tick{animation:tick .45s ease}
@keyframes tick{from{opacity:.25;transform:translateY(-4px)}to{opacity:1;transform:none}}

.venue{font-size:calc(var(--s)*78px);font-weight:300;letter-spacing:.01em;line-height:1.15;margin-top:calc(var(--s)*6px)}
.city{font-size:calc(var(--s)*40px);letter-spacing:.14em;opacity:.85;margin-top:calc(var(--s)*12px);font-weight:300}
.btn{display:inline-flex;align-items:center;gap:9px;margin-top:calc(var(--s)*64px);padding:12px 26px;border-radius:999px;background:var(--cream);color:var(--wine-seal);
     text-decoration:none;font-size:15px;font-weight:400;letter-spacing:.03em;box-shadow:0 8px 22px rgba(0,0,0,.28);transition:transform .25s ease,box-shadow .25s ease}
.btn:active{transform:scale(.97)}
.btn svg{width:13px;height:16px}
.btn svg path,.btn svg circle{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round}
@media (hover:hover){.btn:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(0,0,0,.32)}}
@media (prefers-reduced-motion:reduce){
  .e img,.cue::after{animation:none!important}
  .rv,.e,.cover img{transition-duration:.01s!important;transition-delay:0s!important}
}
</style>
</head>
<body>
  <div class="bgfix" aria-hidden="true"></div>
  <div class="stage" aria-hidden="true">
    <div class="canvas" id="canvas">
      <div class="g tl"><div class="e"><img src="img/flower_tl.webp" alt=""></div></div>
      <div class="g tr"><div class="e"><img src="img/flower_tr.webp" alt=""></div></div>
      <div class="g bl"><div class="e"><img src="img/flower_bl.webp" alt=""></div></div>
      <div class="g br"><div class="e"><img src="img/flower_br.webp" alt=""></div></div>
    </div>
  </div>

  <div class="scroller" id="sc" tabindex="-1">
    <div class="wrap">
      <div class="intro" aria-hidden="true"></div>

      <section class="sec">
        <div class="in-w">
          <img class="names rv" src="img/names.webp" alt="Ahmed &amp; Basma">
          <div class="h2 rv" style="--dl:.1s">Save the date</div>
          <img class="orn1 rv" src="img/orn1.webp" alt="" style="--dl:.15s">
          <div class="dow rv" style="--dl:.2s">Sunday</div>
          <div class="day rv" style="--dl:.3s">29</div>
          <div class="mon rv" style="--dl:.4s">November</div>
          <div class="yr rv" style="--dl:.5s">2026</div>
          <img class="orn2 rv" src="img/orn2.webp" alt="" style="--dl:.6s">
          <div class="time rv" style="--dl:.7s">6:00 PM</div>
          <div class="counting rv" id="counting" style="--dl:.85s">Counting down to our day</div>
          <div class="cd rv" style="--dl:.95s" role="timer" aria-live="off">
            <div><b id="cd-d">00</b><span>Days</span></div>
            <div><b id="cd-h">00</b><span>Hours</span></div>
            <div><b id="cd-m">00</b><span>Minutes</span></div>
            <div><b id="cd-s">00</b><span>Seconds</span></div>
          </div>
        </div>
      </section>

      <section class="sec">
        <div class="in-w">
          <div class="h2 rv">Where we meet</div>
          <img class="orn1 rv" src="img/orn1.webp" alt="" style="--dl:.1s">
          <div class="venue rv" style="--dl:.25s">Azha Venue</div>
          <div class="city rv" style="--dl:.35s">El Shorouk</div>
          <a class="btn rv" style="--dl:.5s" href="https://maps.app.goo.gl/fgfLMXWEqFQD1BREA" target="_blank" rel="noopener">
            <svg viewBox="0 0 14 18" aria-hidden="true"><path d="M7 17C7 17 1 10.5 1 6.6a6 6 0 0 1 12 0C13 10.5 7 17 7 17z"/><circle cx="7" cy="6.6" r="2.1"/></svg>
            View on map
          </a>
        </div>
      </section>
    </div>
  </div>

  <!-- cover: your envelope, opens as you scroll -->
  <section class="cover" id="cover">
    <img id="coverImg" src="img/envelope.webp" alt="Ahmed &amp; Basma wedding invitation envelope">
    <span class="cue" id="cue" aria-hidden="true"></span>
  </section>

<script>
(function(){
  var root=document.documentElement, body=document.body;
  var canvas=document.getElementById('canvas'), stage=document.querySelector('.stage');
  var cover=document.getElementById('cover'), sc=document.getElementById('sc');
  var intro=document.querySelector('.intro'), cue=document.getElementById('cue');
  var img=document.getElementById('coverImg');

  /* text and flowers share one scale, so the text always stays in the clear middle */
  function fit(){
    var r=stage.getBoundingClientRect();
    root.style.setProperty('--s', Math.max(r.width/1080, r.height/1920).toFixed(4));
  }
  fit(); window.addEventListener('resize',function(){fit();update()});

  function ease(x){return x<0?0:x>1?1:x*x*(3-2*x)}
  var ticking=false, armed=false;
  function update(){
    var y=sc.scrollTop, I=Math.max(1,intro.offsetHeight);
    var p0=Math.min(1,Math.max(0,y/I));
    cover.style.setProperty('--co', (1-ease((p0-.35)/.55)).toFixed(3));
    img.style.setProperty('--z', (1+1.5*ease(p0/.95)).toFixed(3));
    cue.style.opacity = p0>.04 ? 0 : 1;
    cover.classList.toggle('gone', p0>=.99);
    if(y>8) body.classList.add('ready');
    if(y>8 && !armed){armed=true; arm();}
    var max=Math.max(1,sc.scrollHeight-sc.clientHeight);
    canvas.style.setProperty('--p',Math.min(1,Math.max(0,y/max)).toFixed(4));
    ticking=false;
  }
  function onScroll(){ if(!ticking){ticking=true;requestAnimationFrame(update)} }
  sc.addEventListener('scroll',onScroll,{passive:true});

  /* envelope fades in once it has loaded */
  function ready(){cover.classList.add('ready')}
  if(img.complete){ready()}else{img.addEventListener('load',ready);img.addEventListener('error',ready)}
  setTimeout(ready,2500);

  /* text appears as it reaches the clear middle of the screen */
  function arm(){
    var els=document.querySelectorAll('.rv');
    if(!('IntersectionObserver' in window)){els.forEach(function(e){e.classList.add('in')});return}
    var io=new IntersectionObserver(function(en){
      en.forEach(function(x){ if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target)} });
    },{root:sc,rootMargin:'-22% 0px -26% 0px',threshold:0});
    els.forEach(function(e){io.observe(e)});
  }

  /* tapping the envelope opens it too */
  sc.addEventListener('click',function(){
    if(sc.scrollTop < intro.offsetHeight*.6) sc.scrollTo({top:intro.offsetHeight,behavior:'smooth'});
  });
  sc.scrollTop=0; try{sc.focus({preventScroll:true})}catch(e){}
  update();

  /* live countdown — Sunday 29 Nov 2026, 6:00 PM Cairo (UTC+2) */
  var target=new Date('2026-11-29T18:00:00+02:00').getTime();
  var ids=['cd-d','cd-h','cd-m','cd-s'], last=[];
  function pad(n){return n<10?'0'+n:''+n}
  function tick(){
    var d=Math.max(0,target-Date.now());
    var v=[Math.floor(d/864e5),Math.floor(d%864e5/36e5),Math.floor(d%36e5/6e4),Math.floor(d%6e4/1e3)];
    v.forEach(function(n,i){
      var t=pad(n), el=document.getElementById(ids[i]);
      if(last[i]!==t){
        el.textContent=t;
        if(last[i]!==undefined){el.classList.remove('tick');void el.offsetWidth;el.classList.add('tick')}
        last[i]=t;
      }
    });
    if(d===0){document.getElementById('counting').textContent='The day is here'}
  }
  tick(); setInterval(tick,1000);
})();
</script>
</body>
</html>
